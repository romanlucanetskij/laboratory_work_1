<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин кроликов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Магазин кроликов</h1>
        <p>Найди себе нового пушистого друга!</p>
    </header>
    <main>
        <section class="product">
            <img src="https://placekitten.com/300/200" alt="Белый кролик">
            <h2>Белый кролик</h2>
            <p>Возраст: 2 месяца</p>
            <p>Цена: 1000₽</p>
            <button>Купить</button>
        </section>
        <section class="product">
            <img src="https://placekitten.com/301/200" alt="Серый кролик">
            <h2>Серый кролик</h2>
            <p>Возраст: 3 месяца</p>
            <p>Цена: 900₽</p>
            <button>Купить</button>
        </section>
        <section class="product">
            <img src="https://placekitten.com/302/200" alt="Пятнистый кролик">
            <h2>Пятнистый кролик</h2>
            <p>Возраст: 1.5 месяца</p>
            <p>Цена: 1200₽</p>
            <button>Купить</button>
        </section>
    </main>
    <footer>
        <p>Контактный телефон: +7 999 000-00-00</p>
    </footer>
</body>
</html>
